name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish addon archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag (vX.Y.Z), got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build addon-only archive
        run: python3 scripts/package_release.py --require-generated-assets --output dist/godot-ai-terrain-tools.zip

      - name: Generate checksum
        working-directory: dist
        run: sha256sum godot-ai-terrain-tools.zip > godot-ai-terrain-tools.zip.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/godot-ai-terrain-tools.zip \
            dist/godot-ai-terrain-tools.zip.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Godot AI Terrain Tools ${GITHUB_REF_NAME#v}"
